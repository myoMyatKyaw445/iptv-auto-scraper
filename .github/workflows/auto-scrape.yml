name: Auto Scrape FMP Live Data

on:
  schedule:
    - cron: '*/3 * * * *'  # 3 မိနစ်တိုင်း အလိုအလျောက် run
  workflow_dispatch:        # Manual run လို့လည်းရ

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper
        run: node scripts/scrape-fmp.js

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fmp_data.json
          git diff --staged --quiet || git commit -m "Auto-update: FMP Live Data"
          git push https://${{ secrets.PAT }}@github.com/myoMyatKyaw445/iptv-auto-scraper.git main